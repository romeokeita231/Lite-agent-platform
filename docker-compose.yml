services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  platform:
    build:
      context: .
      target: platform
    command: ["/bin/sh", "-c", "/platform seed && exec /platform"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/platform?sslmode=disable
      HTTP_ADDR: ":8080"
      STEP_TIMEOUT: 5s
      MAX_STEP_ATTEMPTS: 3
      TENANT_CONCURRENCY: 1
      TENANT_RATE: 0
      POLL_INTERVAL: 100ms
      CONTEXT_RECENT: 8
      CONTEXT_MAX_KEEP: 16
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://policy-example:9090/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      METRICS_ADDR: ":9091"
      POLICY_SECRET_DEMO: ${POLICY_SECRET:-demo-policy-secret}
      POLICY_SECRET_TOOL_SLOW: ${POLICY_SECRET:-demo-policy-secret}
      POLICY_SECRET_HUMAN: ${POLICY_SECRET:-demo-policy-secret}
      DEMO_API_KEY_A: ${DEMO_API_KEY_A:-demo-a-api-key}
      DEMO_API_KEY_B: ${DEMO_API_KEY_B:-demo-b-api-key}
    ports:
      - "8080:8080"
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  policy-example:
    build:
      context: .
      target: policy-example
    environment:
      POLICY_ADDR: ":9090"
      POLICY_SECRET: ${POLICY_SECRET:-demo-policy-secret}
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
