apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-example
  labels:
    app: policy-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-example
  template:
    metadata:
      labels:
        app: policy-example
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: policy-example
          # docker build --target policy-example -t lite-agent-platform-policy-example:local .
          image: lite-agent-platform-policy-example:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: POLICY_ADDR
              value: ":9090"
            - name: POLICY_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POLICY_SECRET_DEMO
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: policy-example
  labels:
    app: policy-example
spec:
  selector:
    app: policy-example
  ports:
    - name: http
      port: 9090
      targetPort: http
